name: CodeQL Advanced Security


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Har dushanba 06:00 UTC


jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read          # faqat kerakli huquqlar
      contents: read
      security-events: write  # alert yozish uchun


    strategy:
      matrix:
        language: [python, javascript]
        # python va js ikkalasini ham skanerlaydi


    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: CodeQL Initialize
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended  # keng qamrovli tahlil


      - name: Autobuild
        uses: github/codeql-action/autobuild@v3


      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "${{ matrix.language }}"
