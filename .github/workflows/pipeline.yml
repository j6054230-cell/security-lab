kkname: Fullstack Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d9371296bf4051010375179853907409
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@1e60f6205b5464e83c7908b896f1345d3e09156a
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@0c45773b623bea8c85750d4d29315d0506385d30
        with:
          path: ./frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test -- --coverage

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./frontend/coverage/

  security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d9371296bf4051010375179853907409
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b6a47833a6932463e76a6e2e5050f55cf6a67f1b
        with:
          languages: javascript
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b6a47833a6932463e76a6e2e5050f55cf6a67f1b
