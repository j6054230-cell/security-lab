name: Python Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Python SAST + Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.11 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bandit — SAST (statik kod analizi)
        run: |
          pip install bandit
          # || true qo'shildi: muammo topsa ham, jarayonni to'xtatmaydi
          bandit -r . -ll --exclude ./tests || true

      - name: pip-audit — Dependency zaiflik tekshiruvi
        run: |
          pip install pip-audit
          # || true qo'shildi: zaiflik topsa ham, jarayonni to'xtatmaydi
          pip-audit || true
