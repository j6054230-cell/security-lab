name: Fullstack Security Pipeline


on:
  push:
    branches: [main]
  pull_request:


jobs:


  # ─── JOB 1: Python backend scan ────────────────
  scan-python:
    name: Python SAST + Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Bandit scan
        run: |
          pip install bandit
          bandit -r ./backend -ll
      - name: pip-audit
        run: |
          pip install pip-audit
          pip install -r backend/requirements.txt
          pip-audit


  # ─── JOB 2: Node.js frontend scan ─────────────
  scan-node:
    name: Node.js Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd frontend && npm ci && npm audit --audit-level=high


  # ─── JOB 3: Deploy (faqat ikkala scan o'tsa) ──
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [scan-python, scan-node]  # KALIT QATOR!
    if: github.ref == 'refs/heads/main'
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      API_KEY:     ${{ secrets.API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "✅ Security scan passed!"
          echo "🚀 Deploying to production..."
