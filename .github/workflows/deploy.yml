name: Deploy to Server

on:
  push:
    branches: [ main ]  # Main branchga kod push bo'lganda ishlaydi

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Loyihangiz serverda qayerda turgan bo'lsa, o'sha yo'lni yozing
            cd /home/jamshid/loyihangiz_nomi 
            git pull origin main
            npm install --force
            # Agar loyiha build bo'lishi kerak bo'lsa:
            # npm run build
            # Agar PM2 ishlatsangiz:
            # pm2 restart all
