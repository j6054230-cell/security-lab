name: Fullstack Security Pipeline

on: [push, pull_request]

jobs:
  scan-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Bandit and pip-audit
        run: |
          pip install bandit pip-audit
          # Bandit va pip-audit backend papkasini tekshiradi
          bandit -r ./backend -ll || true
          pip-audit -r ./backend/requirements.txt || true

  scan-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: NPM Audit
        # ENG MUHIM QISM: buyruqlarni frontend papkasi ichida bajaradi
        working-directory: ./frontend
        run: |
          npm install
          npm audit --audit-level=high || true

  deploy:
    needs: [scan-python, scan-node]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Simulation
        run: |
          echo "✅ Security scan passed!"
          echo "🚀 Deploying to production..."
